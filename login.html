<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login | SmartSikshya</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 min-h-screen">
    <!-- NAVBAR -->
    <nav class="bg-blue-600 text-white sticky top-0 z-50">
      <div
        class="container mx-auto flex justify-between items-center py-4 px-4"
      >
        <h1 class="text-2xl font-bold">SmartSikshya</h1>
        <div>
          <a href="#home" class="mx-2 hover:underline">Home</a>
          <a href="#courses" class="mx-2 hover:underline">Courses</a>
          <a href="#about" class="mx-2 hover:underline">About</a>
          <a href="#login" class="mx-2 hover:underline">Login/Signup</a>
        </div>
      </div>
    </nav>

    <!-- LOGIN CONTAINER -->
    <main
      class="min-h-[calc(100vh-80px)] flex items-center justify-center px-4"
    >
      <div
        class="w-full max-w-6xl bg-white shadow-lg rounded-xl overflow-hidden grid grid-cols-1 md:grid-cols-2"
      >
        <!-- LEFT SIDE -->
        <div
          class="relative bg-gradient-to-br from-purple-700 to-blue-600 p-10 text-white"
        >
          <div class="space-y-5">
            <h1 class="text-3xl font-bold">SmartSikshya</h1>
            <h2 class="text-xl font-semibold">Welcome Back!</h2>
            <p class="text-gray-200">
              Login to access your courses and continue learning.
            </p>

            <ul class="space-y-3">
              <li>✔ Continue learning</li>
              <li>✔ Track progress</li>
              <li>✔ Access certificates</li>
            </ul>
          </div>
        </div>

        <!-- RIGHT SIDE (FORM) -->
        <div class="p-8 md:p-12">
          <h2 class="text-2xl font-semibold text-center mb-8">
            Login to Your Account
          </h2>

          <form class="space-y-5">
            <div>
              <label class="block mb-1 font-medium">Email</label>
              <input
                type="email"
                class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"
                required
              />
            </div>

            <div>
              <label class="block mb-1 font-medium">Password</label>
              <input
                type="password"
                class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"
                required
              />
            </div>

            <div class="flex justify-between text-sm">
              <label class="flex items-center gap-2">
                <input type="checkbox" /> Remember me
              </label>
              <a href="#" class="text-blue-600 hover:underline">
                Forgot Password?
              </a>
            </div>

            <button
              class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700"
            >
              Login
            </button>

            <p class="text-center text-sm">
              Don’t have an account?
              <a href="signup.html" class="text-blue-600 hover:underline">
                Create one
              </a>
            </p>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
