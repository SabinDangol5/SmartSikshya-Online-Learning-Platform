<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmartSikshya</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 min-h-screen">
    <!-- NAVBAR -->
    <nav class="bg-blue-600 text-white sticky top-0 z-50">
      <div
        class="container mx-auto flex justify-between items-center py-4 px-4"
      >
        <h1 class="text-2xl font-bold">SmartSikshya</h1>
        <div>
          <a href="#home" class="mx-2 hover:underline">Home</a>
          <a href="#courses" class="mx-2 hover:underline">Courses</a>
          <a href="#about" class="mx-2 hover:underline">About</a>
          <a href="#login" class="mx-2 hover:underline">Login/Signup</a>
        </div>
      </div>
    </nav>

    <!-- CENTERED SIGNUP CARD -->
    <main
      class="min-h-[calc(100vh-80px)] flex items-center justify-center px-4"
    >
      <div
        class="w-full max-w-6xl bg-white shadow-lg rounded-xl overflow-hidden grid grid-cols-1 md:grid-cols-2"
      >
        <!-- LEFT PANEL -->
        <div
          class="relative bg-gradient-to-br from-purple-700 to-blue-600 p-10 text-white"
        >
          <div class="space-y-6">
            <h1 class="text-3xl font-bold">SmartSikshya</h1>
            <h2 class="text-xl font-semibold">Start Your Learning Journey</h2>
            <p class="text-gray-200">
              Join thousands of learners advancing their careers.
            </p>
            <ul class="space-y-3">
              <li>✔ 1000+ expert-led courses</li>
              <li>✔ Learn at your own pace</li>
              <li>✔ Career-ready certificates</li>
            </ul>
          </div>
        </div>

        <!-- RIGHT PANEL (FORM) -->
        <div class="p-8 md:p-12">
          <h2 class="text-2xl font-semibold text-center mb-8">
            Create your account
          </h2>

          <form class="space-y-5">
            <input
              class="w-full p-3 border rounded-lg"
              placeholder="Full Name"
            />
            <input class="w-full p-3 border rounded-lg" placeholder="Email" />
            <input class="w-full p-3 border rounded-lg" placeholder="Phone" />
            <input
              type="password"
              class="w-full p-3 border rounded-lg"
              placeholder="Password"
            />
            <input
              type="password"
              class="w-full p-3 border rounded-lg"
              placeholder="Confirm Password"
            />

            <label class="flex gap-2 text-sm">
              <input type="checkbox" required />
              I accept the <a class="text-blue-600 underline">Terms</a>
            </label>

            <button
              class="w-full bg-green-600 text-white p-3 rounded-lg font-semibold"
            >
              Signup
            </button>

            <p class="text-center text-sm">
              Already have an account?
              <a href="login.html" class="text-blue-600 underline">Login</a>
            </p>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
